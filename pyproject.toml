[project]
name = "carfinder"
version = "0.1.0"
description = "Local-first CLI that aggregates used-car listings (Craigslist, CarMax, Cars.com, KBB), scores each against a personal-profile rubric, and exports a ranked shortlist to an Obsidian vault."
readme = "README.md"
authors = [
    { name = "Sylvain Le Groux", email = "slegroux@ccrma.stanford.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "click>=8.4.1",
    "httpx[http2]>=0.28.1",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "selectolax>=0.4.9",
]

[project.scripts]
carfinder = "carfinder.cli:cli"

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
